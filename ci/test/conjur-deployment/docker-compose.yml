services:
  openssl:
    image: svagi/openssl:latest
    container_name: openssl_test
    entrypoint:
      - openssl
      - req
      - -newkey
      - rsa:2048
      - -days
      - "1"
      - -nodes
      - -x509
      - -config
      - /tmp/conf/tls.conf
      - -extensions
      - v3_ca
      - -keyout
      - /tmp/conf/test_nginx.key
      - -out
      - /tmp/conf/test_nginx.crt
    volumes:
      - ${PWD}/ci/test/conjur-deployment/configuration/https/:/tmp/conf

  pg:
    image: postgres:15
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  conjur:
    image: ${REGISTRY_URL:-docker.io}/cyberark/conjur:edge
    command: server -a conjur -f /policy/initial_policy.yml
    environment:
      CONJUR_DATA_KEY: 'OyXV68Mip14xj33huGaQKewmmS+gKtDlp6ECZ2iATpU='
      CONJUR_ACCOUNT: conjur
      DATABASE_URL: postgres://postgres@pg/postgres
      RAILS_ENV: development
      CONJUR_AUTHENTICATORS: authn-ldap/test-service,authn-oidc/test-service,authn-jwt/test-service,authn-azure/prod,authn-iam/prod,authn-jwt/gcp,authn
      # Required by test_integration_oidc_authentication.py — enables the v1 POST id_token= endpoint
      # which the mock OIDC server supports. The v2 auth-code+PKCE flow is not testable without a browser.
      CONJUR_FEATURE_OIDC_AUTHENTICATOR_V1_ENABLED: "true"
      # Conjur's SSRF guard blocks authenticator fetches (authn-oidc provider-uri here) that resolve
      # to loopback/RFC1918 ranges. Compose service names resolve inside the bridge network's private
      # subnet, so the guard must be opted out of for this test env. Mirrors conjur's own ci/docker-compose.yml.
      CONJUR_AUTHN_ALLOWED_IP_RANGES: ${CONJUR_AUTHN_ALLOWED_IP_RANGES:-0.0.0.0/0,::/0}
      LDAP_URI: ldap://ldap-server:389
      LDAP_BASE: dc=conjur,dc=net
      LDAP_BINDDN: cn=admin,dc=conjur,dc=net
      LDAP_BINDPW: ldapsecret
      LDAP_FILTER: (uid=%s)
    ports:
      - 80
    volumes:
      - ${PWD}/ci/test/conjur-deployment/configuration:/policy:ro
      - oidc-certs:/oidc-certs:ro
    depends_on:
      - pg
      - ldap-server
      - oidc-server
      - jwt-server

  conjur-https:
    image: nginx:alpine
    ports:
      - 443
      - "443:443"
    volumes:
      - ${PWD}/ci/test/conjur-deployment/configuration/https/:/tmp/conf
      - ${PWD}/ci/test/conjur-deployment/configuration/https/:/etc/nginx/tls/:ro
      - ${PWD}/ci/test/conjur-deployment/configuration/https/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PWD}/ci/test/conjur-deployment/configuration/https/conjur.conf:/etc/nginx/sites-enabled/conjur.conf:ro
      - ${PWD}/ci/test/conjur-deployment/configuration/https/dhparams.pem:/etc/nginx/dhparams.pem:ro
    depends_on:
      - conjur

  conjur-cli:
    image: cyberark/conjur-cli:8
    entrypoint: [ "bash", "-c" ]
    command: [ "sleep 999d" ]
    depends_on:
      - conjur
      - conjur-https

  ldap-server:
    image: osixia/openldap
    command: --copy-service --loglevel debug
    hostname: ldap-server
    environment:
      LDAP_ORGANIZATION: CyberArk
      LDAP_DOMAIN: conjur.net
      LDAP_ADMIN_PASSWORD: ldapsecret
      LDAP_TLS_CA_CRT_FILENAME: "ca-chain.cert.pem"
      LDAP_TLS_CRT_FILENAME: "ldap-server.cert.pem"
      LDAP_TLS_KEY_FILENAME: "ldap-server.key.pem"
      LDAP_TLS_DH_PARAM_FILENAME: 'dhparam.pem'
      LDAP_TLS_VERIFY_CLIENT: try
    ports:
      - "389:389"
    volumes:
      - ${PWD}/ci/test/conjur-deployment/configuration/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ${PWD}/ci/test/conjur-deployment/configuration/ldap/certs:/container/service/slapd/assets/certs:ro

  oidc-server:
    build:
      context: ./ci/test/mock-oidc-server
    hostname: oidc-server
    environment:
      LISTEN_ADDR: ":443"
      # No port here: this becomes the OIDC issuer ("https://oidc-server/oidc"),
      # which must match the authn-oidc "provider-uri" variable exactly (JWT
      # issuer validation is a string comparison), and provider-uri is set to
      # the port-less form.
      PUBLIC_ADDR: "oidc-server"
      CLIENT_ID: "conjur-client"
      CLIENT_SECRET: "conjur-client-secret"
      CERT_PATH: "/certs/oidc-server.cert.pem"
    ports:
      - "9443:443"
    volumes:
      - oidc-certs:/certs

  jwt-server:
    image: cyberark/mock-jwt-server
    ports:
      - 8008:8080
    environment:
      ISSUER: "jwt-server"
      AUDIENCE: "conjur"
      SUBJECT: "test-workload"
      EMAIL: "workload@example.com"
      EXTERNAL_PORT: "8008"

  test:
    privileged: true
    build:
      context: .
      dockerfile: ./ci/test/Dockerfile.test
    environment:
      CONJUR_AUTHN_API_KEY: null
      RUN_AZURE_TESTS: "${RUN_AZURE_TESTS:-}"
      AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID:-}"
      AZURE_RESOURCE_GROUP: "${AZURE_RESOURCE_GROUP:-}"
      USER_ASSIGNED_IDENTITY: "${USER_ASSIGNED_IDENTITY:-}"
      USER_ASSIGNED_IDENTITY_CLIENT_ID: "${USER_ASSIGNED_IDENTITY_CLIENT_ID:-}"
      RUN_AWS_TESTS: "${RUN_AWS_TESTS:-}"
      AWS_ACCOUNT_ID: "${AWS_ACCOUNT_ID:-}"
      AWS_ROLE_NAME: "${AWS_ROLE_NAME:-}"
      RUN_GCP_TESTS: "${RUN_GCP_TESTS:-}"
      GCP_ID_TOKEN: "${GCP_ID_TOKEN:-}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-}"
      NO_PROXY: "169.254.169.254,localhost,127.0.0.1,conjur-https,conjur"
      no_proxy: "169.254.169.254,localhost,127.0.0.1,conjur-https,conjur"
    command: ['sleep', '999d']
    volumes:
      - ${PWD}:/opt/conjur-api-python
      - oidc-certs:/oidc-certs:ro

volumes:
  oidc-certs:
